name: Verificar motor de custas A01

on:
  push:
    paths:
      - 'custas.html'
      - 'custas-tecnico.html'
      - 'scripts/test-custas.mjs'
      - 'scripts/test-custas-simple.mjs'
      - 'scripts/test-custas-cenarios.mjs'
      - 'scripts/test-custas-browser.mjs'
      - 'scripts/fixtures/**'
      - 'scripts/validate-site.mjs'
      - '.github/workflows/custas-tests.yml'
  pull_request:
    paths:
      - 'custas.html'
      - 'custas-tecnico.html'
      - 'scripts/test-custas.mjs'
      - 'scripts/test-custas-simple.mjs'
      - 'scripts/test-custas-cenarios.mjs'
      - 'scripts/test-custas-browser.mjs'
      - 'scripts/fixtures/**'
      - 'scripts/validate-site.mjs'
      - '.github/workflows/custas-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe e ligações do site
        run: node scripts/validate-site.mjs
      - name: Testes da conta simples por impulso
        run: node scripts/test-custas-simple.mjs
      - name: Testes de regressão do módulo técnico A01
        run: node scripts/test-custas.mjs
      - name: Cenários sintéticos multi-interveniente
        run: node scripts/test-custas-cenarios.mjs
      - name: Teste de interface em Chromium
        run: node scripts/test-custas-browser.mjs
