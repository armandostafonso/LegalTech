name: Verificar LegalTech
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar páginas, scripts e recursos
        run: node scripts/validate-site.mjs
      - name: Instalar navegador de testes
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercitar ferramentas no navegador
        run: node scripts/browser-smoke.mjs
