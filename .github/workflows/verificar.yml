name: Verificar Cita-Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/calendar-contract.mjs
      - run: node scripts/prazo-core-contract.mjs
      - run: node scripts/citacheck-parity.mjs --offline
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node scripts/citacheck-regression.mjs
