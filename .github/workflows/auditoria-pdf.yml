name: Auditoria de PDF fictício
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditoria-pdf.yml'
      - 'scripts/pdf-integration.mjs'
      - 'anonimizador.html'
      - 'pa.html'
      - 'assets/pa-pdf.js'
      - 'scripts/pa-pdf-smoke.mjs'
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de ensaio
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Gerar PDF fictício e verificar resultado anonimizado
        run: node scripts/pdf-integration.mjs
      - name: Verificar extração de PDF textual e bloqueio de documento misto no PA
        run: node scripts/pa-pdf-smoke.mjs
